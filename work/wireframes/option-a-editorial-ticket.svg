<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Kettigo landing page wireframe A — Editorial ticket</title>
  <desc id="desc">A split editorial landing page with a large headline, an oversized prize ticket, and a three-step explanation.</desc>
  <rect width="1440" height="900" fill="#f6f6f3"/>
  <rect x="28" y="28" width="1384" height="844" rx="18" fill="#ffffff" stroke="#242424" stroke-width="2"/>
  <rect x="28" y="28" width="1384" height="40" rx="18" fill="#e8e8e4"/>
  <path d="M28 68H1412" stroke="#242424" stroke-width="2"/>
  <circle cx="50" cy="48" r="5" fill="#a8a8a2"/><circle cx="68" cy="48" r="5" fill="#a8a8a2"/><circle cx="86" cy="48" r="5" fill="#a8a8a2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#181818">
    <text x="88" y="112" font-size="22" font-weight="700">Kettigo</text>
    <text x="614" y="112" font-size="16" fill="#686864">How it works</text>
    <text x="748" y="112" font-size="16" fill="#686864">Why Kettigo</text>
    <rect x="1192" y="85" width="164" height="42" rx="6" fill="#242424"/>
    <text x="1274" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Join the waitlist</text>
  </g>
  <path d="M28 146H1412" stroke="#b8b8b2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="232" font-size="15" font-weight="700" letter-spacing="2" fill="#686864">PRIZE-LINKED USDC SAVINGS</text>
    <text x="88" y="326" font-family="Georgia, serif" font-size="74" font-weight="700" letter-spacing="-4" fill="#181818">Save steadily.</text>
    <text x="88" y="401" font-family="Georgia, serif" font-size="74" font-weight="700" letter-spacing="-4" fill="#181818">Win brilliantly.</text>
    <text x="88" y="458" font-size="20" fill="#62625e">Keep building your savings while staying eligible</text>
    <text x="88" y="486" font-size="20" fill="#62625e">at the end of every draw.</text>
    <rect x="88" y="528" width="164" height="50" rx="6" fill="#242424"/>
    <text x="170" y="559" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Join the waitlist</text>
    <rect x="264" y="528" width="156" height="50" rx="6" fill="#ffffff" stroke="#242424" stroke-width="2"/>
    <text x="342" y="559" text-anchor="middle" font-size="16" font-weight="700" fill="#181818">See how it works</text>
  </g>

  <rect x="720" y="146" width="692" height="508" fill="#e5e5e0"/>
  <path d="M720 146V654" stroke="#242424" stroke-width="2"/>
  <text x="746" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6a6a65">SIGNATURE PRIZE TICKET</text>
  <g transform="translate(822 236) rotate(-5 245 145)">
    <rect x="0" y="0" width="490" height="290" rx="10" fill="#ffffff" stroke="#242424" stroke-width="2"/>
    <circle cx="0" cy="145" r="14" fill="#e5e5e0" stroke="#242424" stroke-width="2"/>
    <circle cx="490" cy="145" r="14" fill="#e5e5e0" stroke="#242424" stroke-width="2"/>
    <text x="36" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#666661">WEEKLY DRAW ENTRY</text>
    <path d="M36 76H454M36 206H454" stroke="#a7a7a1" stroke-dasharray="7 7"/>
    <text x="36" y="122" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555550">Your savings</text>
    <text x="454" y="122" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#181818">Set your chances</text>
    <text x="36" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555550">At draw close</text>
    <text x="454" y="162" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#181818">Check &amp; claim</text>
    <text x="36" y="250" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#181818">Kettigo</text>
    <text x="454" y="250" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#555550">№ 000184</text>
  </g>

  <path d="M28 654H1412M489 654V872M950 654V872" stroke="#242424" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="708" font-size="14" font-weight="700" letter-spacing="2" fill="#777772">01</text>
    <text x="72" y="756" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#181818">Save USDC</text>
    <text x="72" y="792" font-size="17" fill="#666661">Add savings when you are ready.</text>
    <text x="533" y="708" font-size="14" font-weight="700" letter-spacing="2" fill="#777772">02</text>
    <text x="533" y="756" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#181818">Stay eligible</text>
    <text x="533" y="792" font-size="17" fill="#666661">Your balance sets your chances.</text>
    <text x="994" y="708" font-size="14" font-weight="700" letter-spacing="2" fill="#777772">03</text>
    <text x="994" y="756" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#181818">Check &amp; claim</text>
    <text x="994" y="792" font-size="17" fill="#666661">See the result after the draw.</text>
  </g>
