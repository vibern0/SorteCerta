<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SorteCerta landing page wireframe C — Quiet invitation</title>
  <desc id="desc">A restrained invitation-only landing page with a centered editorial message, a calm three-step line, and a dark waitlist band.</desc>
  <rect width="1440" height="900" fill="#f6f6f3"/>
  <rect x="28" y="28" width="1384" height="844" rx="18" fill="#ffffff" stroke="#242424" stroke-width="2"/>
  <rect x="28" y="28" width="1384" height="40" rx="18" fill="#e8e8e4"/>
  <path d="M28 68H1412" stroke="#242424" stroke-width="2"/>
  <circle cx="50" cy="48" r="5" fill="#a8a8a2"/><circle cx="68" cy="48" r="5" fill="#a8a8a2"/><circle cx="86" cy="48" r="5" fill="#a8a8a2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#181818">
    <text x="88" y="112" font-size="22" font-weight="700">SorteCerta</text>
    <text x="643" y="112" font-size="16" fill="#686864">The idea</text>
    <text x="744" y="112" font-size="16" fill="#686864">How it works</text>
    <rect x="1186" y="85" width="170" height="42" rx="6" fill="#ffffff" stroke="#242424" stroke-width="2"/>
    <text x="1271" y="111" text-anchor="middle" font-size="15" font-weight="700">Invitation access</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="720" y="232" font-size="15" font-weight="700" letter-spacing="2" fill="#686864">SAVE FOR TOMORROW. STAY OPEN TO SURPRISE.</text>
    <text x="720" y="330" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="-4" fill="#181818">Good saving habits.</text>
    <text x="720" y="402" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="-4" fill="#181818">A little more upside.</text>
    <text x="720" y="455" font-size="19" fill="#62625e">A familiar saving rhythm with a chance to claim a prize after each draw.</text>
  </g>

  <path d="M260 594H1180" stroke="#a5a59f" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="330" cy="594" r="25" fill="#ffffff" stroke="#242424" stroke-width="2"/>
    <text x="330" y="600" font-size="16" font-weight="700" fill="#181818">1</text>
    <text x="330" y="653" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#181818">Save</text>
    <text x="330" y="685" font-size="16" fill="#666661">Add USDC at your pace.</text>
    <circle cx="720" cy="594" r="25" fill="#ffffff" stroke="#242424" stroke-width="2"/>
    <text x="720" y="600" font-size="16" font-weight="700" fill="#181818">2</text>
    <text x="720" y="653" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#181818">Stay in</text>
    <text x="720" y="685" font-size="16" fill="#666661">Your balance sets your chances.</text>
    <circle cx="1110" cy="594" r="25" fill="#ffffff" stroke="#242424" stroke-width="2"/>
    <text x="1110" y="600" font-size="16" font-weight="700" fill="#181818">3</text>
    <text x="1110" y="653" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#181818">Check</text>
    <text x="1110" y="685" font-size="16" fill="#666661">See the result when the draw ends.</text>
  </g>

  <rect x="28" y="744" width="1384" height="128" fill="#242424"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="86" y="788" font-size="13" font-weight="700" letter-spacing="2" fill="#bcbcb6">INVITATION ONLY</text>
    <text x="86" y="834" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#ffffff">Already have a code?</text>
    <rect x="694" y="779" width="232" height="52" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="714" y="811" font-size="15" fill="#ddddda">Approved email</text>
    <rect x="940" y="779" width="232" height="52" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="960" y="811" font-size="15" fill="#ddddda">Invitation code</text>
    <rect x="1186" y="779" width="170" height="52" rx="6" fill="#ffffff"/>
    <text x="1271" y="811" text-anchor="middle" font-size="16" font-weight="700" fill="#242424">Join the waitlist</text>
  </g>
</svg>
